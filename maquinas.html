<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuração de máquinas — Help Desk Matriz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <img src="assets/logo-comm.png" alt="Comm" class="logo-principal" />
      <span class="selo-setor">Tecnologia da Informação</span>
    </div>
    <nav class="app-nav">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="chamados.html">Chamados</a>
      <a class="nav-link" href="relatorios.html">Relatórios</a>
      <a class="nav-link" href="visitas.html">Visitas</a>
      <a class="nav-link" href="maquinas.html">Máquinas</a>
      <a class="nav-link" href="estoque.html">Estoque</a>
      <a class="nav-link" id="nav-link-usuarios" href="usuarios.html" style="display:none">Usuários</a>
      <a class="nav-link" id="nav-link-supervisao" href="supervisao.html" style="display:none">Supervisão</a>
    </nav>
    <div class="app-user">
      <span class="nome" id="nav-nome">—</span>
      <span class="badge" id="nav-papel"></span>
      <button class="botao-secundario" id="nav-sair">Sair</button>
    </div>
  </header>

  <main class="app-main">
    <div class="topo-pagina">
      <h1>Configuração de máquinas</h1>
      <button class="botao-primario" id="btn-nova-maquina">+ Nova máquina</button>
    </div>

    <div class="filtros">
      <select id="filtro-status-maquina">
        <option value="">Todos os status</option>
        <option value="ativa">Ativa</option>
        <option value="manutencao">Em manutenção</option>
        <option value="baixada">Baixada</option>
      </select>
      <input type="text" id="filtro-busca-maquina" placeholder="Buscar por nome, setor ou responsável..." style="max-width:280px;" />
    </div>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome / Patrimônio</th>
            <th>Setor</th>
            <th>Responsável</th>
            <th>Sistema</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-maquinas">
          <tr><td colspan="6" class="carregando">Carregando máquinas...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal: detalhes da máquina -->
  <div class="modal-fundo" id="modal-maquina">
    <div class="modal" style="max-width:600px;">
      <h2 id="modal-maquina-titulo">Nova máquina</h2>
      <form class="modal-form" id="form-maquina">
        <input type="hidden" id="maquina-id" />

        <div class="linha-dupla">
          <div class="campo">
            <label for="maquina-nome">Nome / Patrimônio</label>
            <input type="text" id="maquina-nome" required placeholder="Ex: PC-FIN-07" />
          </div>
          <div class="campo">
            <label for="maquina-status">Status</label>
            <select id="maquina-status">
              <option value="ativa">Ativa</option>
              <option value="manutencao">Em manutenção</option>
              <option value="baixada">Baixada</option>
            </select>
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="maquina-setor">Setor / Localização</label>
            <input type="text" id="maquina-setor" placeholder="Ex: Financeiro - 2º andar" />
          </div>
          <div class="campo">
            <label for="maquina-responsavel">Usuário responsável</label>
            <input type="text" id="maquina-responsavel" placeholder="Ex: Maria Souza" />
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="maquina-so">Sistema operacional</label>
            <input type="text" id="maquina-so" placeholder="Ex: Windows 11 Pro" />
          </div>
          <div class="campo">
            <label for="maquina-ip">Endereço IP</label>
            <input type="text" id="maquina-ip" placeholder="Ex: 192.168.1.45" />
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="maquina-processador">Processador</label>
            <input type="text" id="maquina-processador" placeholder="Ex: Intel i5-10400" />
          </div>
          <div class="campo">
            <label for="maquina-memoria">Memória RAM</label>
            <input type="text" id="maquina-memoria" placeholder="Ex: 16GB" />
          </div>
        </div>

        <div class="campo">
          <label for="maquina-armazenamento">Armazenamento</label>
          <input type="text" id="maquina-armazenamento" placeholder="Ex: SSD 480GB" />
        </div>

        <div class="campo">
          <label for="maquina-observacoes">Observações</label>
          <textarea id="maquina-observacoes" rows="2"></textarea>
        </div>

        <p class="erro-msg" id="maquina-erro"></p>

        <div class="modal-acoes">
          <button type="button" class="botao-secundario" id="btn-cancelar-maquina">Cancelar</button>
          <button type="submit" class="botao-primario" id="btn-salvar-maquina">Salvar</button>
        </div>
      </form>

      <!-- Histórico de manutenções: só aparece ao editar uma máquina já existente -->
      <div id="bloco-historico" style="display:none; margin-top:24px; border-top:1px solid var(--cor-borda); padding-top:20px;">
        <h2>Histórico de manutenções</h2>
        <div id="lista-historico" style="margin-bottom:14px;">
          <p class="texto-suave">Nenhum registro ainda.</p>
        </div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="novo-historico-texto" placeholder="Descreva a manutenção realizada..." />
          <button type="button" class="botao-secundario" id="btn-add-historico">Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/maquinas.js"></script>
</body>
</html>
