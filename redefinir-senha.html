<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Desk Matriz — Nova senha</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-conteudo">

      <div class="marca-topo">
        <img src="assets/logo-comm-branco.png" alt="Comm" />
        <span class="divisor"></span>
        <span class="texto"><strong>Ferramentas TI</strong> &bull; Help Desk Matriz</span>
      </div>

      <div class="auth-card">
        <h1>Definir nova senha</h1>
        <p class="subtitulo" id="senha-subtitulo">Carregando...</p>

        <form id="form-senha" class="auth-form ativo" style="display:none">
          <div class="campo">
            <label for="nova-senha">Nova senha</label>
            <input type="password" id="nova-senha" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="campo">
            <label for="nova-senha-confirma">Repita a nova senha</label>
            <input type="password" id="nova-senha-confirma" required minlength="6" autocomplete="new-password" />
          </div>
          <p class="erro-msg" id="senha-erro"></p>
          <button type="submit" class="botao-primario botao-bloco">Salvar nova senha</button>
        </form>

        <p style="text-align:center; margin:16px 0 0;">
          <a href="index.html" style="font-size:13px; color:var(--cor-texto-suave); text-decoration:underline;">Voltar</a>
        </p>
      </div>

    </div>
  </div>

  <script type="module" src="js/redefinir-senha.js"></script>
</body>
</html>
