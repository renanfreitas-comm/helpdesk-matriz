<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque — Help Desk Matriz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <img src="assets/logo-comm.png" alt="Comm" class="logo-principal" />
      <span class="selo-setor">Tecnologia da Informação</span>
    </div>
    <nav class="app-nav">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="chamados.html">Chamados</a>
      <a class="nav-link" href="relatorios.html">Relatórios</a>
      <a class="nav-link" href="maquinas.html">Máquinas</a>
      <a class="nav-link" href="estoque.html">Estoque</a>
      <a class="nav-link" id="nav-link-usuarios" href="usuarios.html" style="display:none">Usuários</a>
      <a class="nav-link" id="nav-link-supervisao" href="supervisao.html" style="display:none">Supervisão</a>
    </nav>
    <div class="app-user">
      <span class="nome" id="nav-nome">—</span>
      <span class="badge" id="nav-papel"></span>
      <button class="botao-secundario" id="nav-sair">Sair</button>
    </div>
  </header>

  <main class="app-main">
    <div class="topo-pagina">
      <h1>Estoque</h1>
      <button class="botao-primario" id="btn-novo-item">+ Novo item</button>
    </div>
    <p class="texto-suave" style="margin-top:-14px;margin-bottom:20px;">
      Controle dos equipamentos que chegam, são configurados e saem da TI.
    </p>

    <div class="filtros">
      <input type="text" id="filtro-busca-item" placeholder="Buscar por equipamento, S/N, ativo ou loja/setor..." style="max-width:320px;" />
      <select id="filtro-situacao">
        <option value="">Todas as situações</option>
        <option value="recebido">Recebido</option>
        <option value="em_configuracao">Em configuração</option>
        <option value="aguardando_peca">Aguardando peça</option>
        <option value="concluido">Concluído</option>
        <option value="entregue">Entregue</option>
      </select>
    </div>

    <div class="tabela-wrapper">
      <div class="tabela-scroll">
      <table>
        <thead>
          <tr>
            <th>Equipamento</th>
            <th>S/N</th>
            <th>Ativo</th>
            <th>Chegada</th>
            <th>Delegação</th>
            <th>Prioridade</th>
            <th>Saída</th>
            <th>Técnico</th>
            <th>Loja/Setor</th>
            <th>Situação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-estoque">
          <tr><td colspan="11" class="carregando">Carregando itens...</td></tr>
        </tbody>
      </table>
      </div>
    </div>
  </main>

  <!-- Modal: item de estoque / equipamento -->
  <div class="modal-fundo" id="modal-item">
    <div class="modal" style="max-width:600px;">
      <h2 id="modal-item-titulo">Novo item</h2>
      <form class="modal-form" id="form-item">
        <input type="hidden" id="item-id" />

        <div class="campo">
          <label for="item-equipamento">Equipamento</label>
          <input type="text" id="item-equipamento" required placeholder="Ex: Notebook Dell Latitude 3420" />
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="item-serial">S/N (número de série)</label>
            <input type="text" id="item-serial" placeholder="Ex: 8J3K2L1" />
          </div>
          <div class="campo">
            <label for="item-ativo">Ativo</label>
            <input type="text" id="item-ativo" placeholder="Ex: PAT-0452" />
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="item-chegada">Chegada</label>
            <input type="date" id="item-chegada" />
          </div>
          <div class="campo">
            <label for="item-saida">Saída</label>
            <input type="date" id="item-saida" />
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="item-delegacao">Delegação</label>
            <input type="text" id="item-delegacao" placeholder="Ex: Loja Matriz" />
          </div>
          <div class="campo">
            <label for="item-loja-setor">Loja/Setor</label>
            <input type="text" id="item-loja-setor" placeholder="Ex: Financeiro" />
          </div>
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="item-prioridade">Prioridade</label>
            <select id="item-prioridade">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div class="campo">
            <label for="item-tecnico">Técnico</label>
            <select id="item-tecnico">
              <option value="">Sem técnico</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="item-situacao">Situação</label>
          <select id="item-situacao">
            <option value="recebido">Recebido</option>
            <option value="em_configuracao">Em configuração</option>
            <option value="aguardando_peca">Aguardando peça</option>
            <option value="concluido">Concluído</option>
            <option value="entregue">Entregue</option>
          </select>
        </div>

        <p class="erro-msg" id="item-erro"></p>

        <div class="modal-acoes">
          <button type="button" class="botao-secundario" id="btn-cancelar-item">Cancelar</button>
          <button type="submit" class="botao-primario" id="btn-salvar-item">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/estoque.js"></script>
</body>
</html>
