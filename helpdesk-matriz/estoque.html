<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estoque — Help Desk Matriz</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo">
      <img src="assets/logo-comm.png" alt="Comm" class="logo-principal" />
      <span class="selo-setor">Tecnologia da Informação</span>
    </div>
    <nav class="app-nav">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="chamados.html">Chamados</a>
      <a class="nav-link" href="relatorios.html">Relatórios</a>
      <a class="nav-link" href="maquinas.html">Máquinas</a>
      <a class="nav-link" href="estoque.html">Estoque</a>
      <a class="nav-link" id="nav-link-usuarios" href="usuarios.html" style="display:none">Usuários</a>
      <a class="nav-link" id="nav-link-supervisao" href="supervisao.html" style="display:none">Supervisão</a>
    </nav>
    <div class="app-user">
      <span class="nome" id="nav-nome">—</span>
      <span class="badge" id="nav-papel"></span>
      <button class="botao-secundario" id="nav-sair">Sair</button>
    </div>
  </header>

  <main class="app-main">
    <div class="topo-pagina">
      <h1>Estoque</h1>
      <button class="botao-primario" id="btn-novo-item">+ Novo item</button>
    </div>

    <div class="filtros">
      <input type="text" id="filtro-busca-item" placeholder="Buscar item ou categoria..." style="max-width:280px;" />
      <label style="display:flex; align-items:center; gap:6px; font-weight:600; font-size:13px; color:var(--cor-texto-suave);">
        <input type="checkbox" id="filtro-somente-baixo" style="width:auto;" /> Somente estoque baixo
      </label>
    </div>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Categoria</th>
            <th>Quantidade atual</th>
            <th>Mínimo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-estoque">
          <tr><td colspan="5" class="carregando">Carregando itens...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal: item de estoque -->
  <div class="modal-fundo" id="modal-item">
    <div class="modal" style="max-width:560px;">
      <h2 id="modal-item-titulo">Novo item</h2>
      <form class="modal-form" id="form-item">
        <input type="hidden" id="item-id" />

        <div class="campo">
          <label for="item-nome">Nome do item</label>
          <input type="text" id="item-nome" required placeholder="Ex: Cabo de rede Cat6" />
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="item-categoria">Categoria</label>
            <input type="text" id="item-categoria" placeholder="Ex: Cabos, Periféricos, Peças" />
          </div>
          <div class="campo">
            <label for="item-unidade">Unidade</label>
            <input type="text" id="item-unidade" placeholder="Ex: un, m, caixa" />
          </div>
        </div>

        <div class="linha-dupla" id="linha-qtd-inicial">
          <div class="campo">
            <label for="item-quantidade-inicial">Quantidade inicial</label>
            <input type="number" id="item-quantidade-inicial" min="0" value="0" />
          </div>
          <div class="campo">
            <label for="item-quantidade-minima">Quantidade mínima (alerta)</label>
            <input type="number" id="item-quantidade-minima" min="0" value="0" />
          </div>
        </div>

        <p class="erro-msg" id="item-erro"></p>

        <div class="modal-acoes">
          <button type="button" class="botao-secundario" id="btn-cancelar-item">Cancelar</button>
          <button type="submit" class="botao-primario" id="btn-salvar-item">Salvar</button>
        </div>
      </form>

      <!-- Movimentações: só aparece ao editar um item já existente -->
      <div id="bloco-movimentacao" style="display:none; margin-top:24px; border-top:1px solid var(--cor-borda); padding-top:20px;">
        <h2>Registrar movimentação — em estoque: <span id="qtd-atual-label">0</span></h2>
        <div class="linha-dupla" style="margin-bottom:10px;">
          <select id="mov-tipo">
            <option value="entrada">Entrada (reposição)</option>
            <option value="saida">Saída (uso/retirada)</option>
          </select>
          <input type="number" id="mov-quantidade" min="1" value="1" placeholder="Quantidade" />
        </div>
        <div style="display:flex; gap:8px; margin-bottom:20px;">
          <input type="text" id="mov-motivo" placeholder="Motivo / finalidade (ex: usado no chamado #123)" />
          <button type="button" class="botao-secundario" id="btn-registrar-mov">Registrar</button>
        </div>

        <h2>Histórico de movimentações</h2>
        <div id="lista-movimentacoes">
          <p class="texto-suave">Nenhuma movimentação ainda.</p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/estoque.js"></script>
</body>
</html>
